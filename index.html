<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TempMail — Disposable Inbox</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --elevated: #22262f;
      --border: #2a2f3a;
      --text: #e4e6eb;
      --muted: #8b92a8;
      --accent: #4f8cff;
      --accent-hover: #3a7aee;
      --danger: #ff4757;
      --danger-hover: #e03e4c;
      --success: #2ed573;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 720px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .email-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: stretch;
    }
    .email-row input {
      flex: 1 1 200px;
      background: var(--elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .email-row input:focus {
      border-color: var(--accent);
    }
    .email-row input::placeholder {
      color: var(--muted);
    }
    .btn {
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: var(--elevated);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #2d3340; }
    .btn-danger {
      background: var(--danger);
      color: #fff;
    }
    .btn-danger:hover { background: var(--danger-hover); }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .status {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 10px;
      min-height: 1.2em;
    }
    .status.ok { color: var(--success); }
    .status.err { color: var(--danger); }
    .inbox-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .inbox-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .badge {
      background: var(--elevated);
      color: var(--muted);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .message-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .msg:hover {
      background: #2a2f3a;
      border-color: #3a4050;
    }
    .msg.unread {
      border-left: 3px solid var(--accent);
    }
    .msg-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }
    .msg-subj {
      font-weight: 600;
      font-size: 0.95rem;
      word-break: break-word;
      line-height: 1.3;
    }
    .msg-date {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .msg-from {
      font-size: 0.82rem;
      color: var(--muted);
      word-break: break-all;
    }
    .msg-body-preview {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px 10px;
      font-size: 0.9rem;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--muted);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Modal */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .modal-header h3 {
      font-size: 1rem;
      word-break: break-word;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text);
      word-break: break-word;
    }
    .modal-body iframe {
      width: 100%;
      border: none;
      min-height: 300px;
      background: #fff;
      border-radius: 8px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin-bottom: 14px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .meta span { display: inline-flex; gap: 4px; }
    .meta strong { color: var(--text); }
    @media (max-width: 480px) {
      body { padding: 14px 10px; }
      .card { padding: 16px; }
      header h1 { font-size: 1.35rem; }
      .btn { padding: 11px 14px; font-size: 0.9rem; }
      .email-row input { font-size: 0.95rem; padding: 11px 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📧 TempMail</h1>
      <p>Disposable email inbox powered by mail.tm</p>
    </header>

    <div class="card">
      <div class="email-row">
        <input type="text" id="emailInput" placeholder="e.g. john" autocomplete="off" spellcheck="false">
        <select id="domainSelect" class="btn btn-secondary" style="padding:12px 14px; appearance:none; cursor:pointer;">
          <option value="">Loading domains…</option>
        </select>
        <button class="btn btn-secondary" id="randomBtn" title="Random address">🎲</button>
        <button class="btn btn-primary" id="createBtn">Create Inbox</button>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" id="copyBtn">📋 Copy Email</button>
        <button class="btn btn-danger" id="resetBtn">🗑 Reset</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <div class="inbox-header">
        <h2>Inbox</h2>
        <span class="badge" id="countBadge">0 messages</span>
      </div>
      <div class="message-list" id="messageList">
        <div class="empty">No messages yet. Create an inbox and wait for emails.</div>
      </div>
    </div>
  </div>

  <!-- Message Modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalSubject">Subject</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const API = 'https://api.mail.tm';
    const LS_KEY = 'tempmail_session_v1';
    const POLL_INTERVAL = 8000;

    const $ = id => document.getElementById(id);
    let session = null; // {address, password, token, accountId, tokenAt}
    let domains = [];
    let pollTimer = null;
    let messagesCache = [];

    async function api(path, opts = {}) {
      const url = `${API}${path}`;
      const res = await fetch(url, {
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
          ...(opts.token ? { 'Authorization': `Bearer ${opts.token}` } : {}),
          ...(opts.headers || {})
        },
        ...opts
      });
      if (!res.ok) {
        let errText = res.statusText;
        try { const j = await res.json(); errText = j.detail || j.message || JSON.stringify(j); } catch(e){}
        throw new Error(`${res.status}: ${errText}`);
      }
      if (res.status === 204) return null;
      return res.json();
    }

    function setStatus(msg, type='') {
      const el = $('status');
      el.textContent = msg;
      el.className = 'status ' + (type || '');
    }

    function saveSession() {
      if (session) localStorage.setItem(LS_KEY, JSON.stringify(session));
      else localStorage.removeItem(LS_KEY);
    }

    function loadSession() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) session = JSON.parse(raw);
      } catch(e) { session = null; }
    }

    async function fetchDomains() {
      try {
        const data = await api('/domains');
        domains = (data['hydra:member'] || []).map(d => d.domain).filter(Boolean);
        const sel = $('domainSelect');
        sel.innerHTML = '';
        if (!domains.length) {
          sel.innerHTML = '<option value="">No domains</option>';
          return;
        }
        domains.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d;
          opt.textContent = `@${d}`;
          sel.appendChild(opt);
        });
      } catch(e) {
        setStatus('Failed to load domains: ' + e.message, 'err');
      }
    }

    function randomString(len=10) {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let s = '';
      for (let i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
      return s;
    }

    function generateRandom() {
      const user = randomString(8);
      $('emailInput').value = user;
    }

    async function createInbox() {
      const user = $('emailInput').value.trim().toLowerCase().replace(/[^a-z0-9._-]/g, '');
      const domain = $('domainSelect').value;
      if (!user) { setStatus('Enter a username.', 'err'); return; }
      if (!domain) { setStatus('No domain available.', 'err'); return; }
      const address = `${user}@${domain}`;
      const password = 'TempPass_' + randomString(16);

      setStatus('Creating inbox…');
      try {
        // Create account
        await api('/accounts', {
          method: 'POST',
          body: JSON.stringify({ address, password })
        });
        // Get token
        const tokenData = await api('/token', {
          method: 'POST',
          body: JSON.stringify({ address, password })
        });
        session = {
          address,
          password,
          token: tokenData.token,
          accountId: tokenData.id,
          tokenAt: Date.now()
        };
        saveSession();
        $('emailInput').value = address.split('@')[0];
        setStatus(`Inbox ready: ${address}`, 'ok');
        messagesCache = [];
        renderMessages([]);
        startPolling();
      } catch(e) {
        if (e.message.includes('already exists') || e.message.includes('409')) {
          // Try to login instead
          try {
            const tokenData = await api('/token', {
              method: 'POST',
              body: JSON.stringify({ address, password })
            });
            session = {
              address,
              password,
              token: tokenData.token,
              accountId: tokenData.id,
              tokenAt: Date.now()
            };
            saveSession();
            setStatus(`Logged into existing inbox: ${address}`, 'ok');
            messagesCache = [];
            renderMessages([]);
            startPolling();
            return;
          } catch(e2) {
            setStatus('Account exists but login failed. Pick a different name.', 'err');
            return;
          }
        }
        setStatus('Error: ' + e.message, 'err');
      }
    }

    async function refreshToken() {
      if (!session) return;
      try {
        const tokenData = await api('/token', {
          method: 'POST',
          body: JSON.stringify({ address: session.address, password: session.password })
        });
        session.token = tokenData.token;
        session.accountId = tokenData.id;
        session.tokenAt = Date.now();
        saveSession();
      } catch(e) {
        setStatus('Session expired. Please reset and create a new inbox.', 'err');
        stopPolling();
      }
    }

    async function fetchMessages() {
      if (!session) return;
      try {
        const data = await api('/messages', { token: session.token });
        const msgs = (data['hydra:member'] || []);
        // Detect new messages
        const newIds = new Set(msgs.map(m => m.id));
        const hadNew = msgs.length > messagesCache.length || msgs.some(m => !messagesCache.find(c => c.id === m.id));
        messagesCache = msgs;
        renderMessages(msgs);
        if (hadNew && msgs.length > 0) {
          setStatus(`${msgs.length} message(s) in inbox`, 'ok');
        }
      } catch(e) {
        if (e.message.includes('401') || e.message.includes('JWT')) {
          await refreshToken();
        } else {
          // Silent fail on poll
        }
      }
    }

    async function fetchMessage(id) {
      if (!session) return null;
      return api(`/messages/${id}`, { token: session.token });
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleString();
    }

    function renderMessages(msgs) {
      const list = $('messageList');
      $('countBadge').textContent = `${msgs.length} message${msgs.length !== 1 ? 's' : ''}`;
      if (!msgs.length) {
        list.innerHTML = '<div class="empty">No messages yet. Create an inbox and wait for emails.</div>';
        return;
      }
      list.innerHTML = '';
      msgs.forEach(m => {
        const div = document.createElement('div');
        div.className = 'msg unread';
        div.innerHTML = `
          <div class="msg-top">
            <div class="msg-subj">${escapeHtml(m.subject || '(no subject)')}</div>
            <div class="msg-date">${formatDate(m.createdAt)}</div>
          </div>
          <div class="msg-from">From: ${escapeHtml(m.from?.address || m.from?.name || 'unknown')}</div>
          <div class="msg-body-preview">${escapeHtml(m.intro || '')}</div>
        `;
        div.onclick = () => openMessage(m.id);
        list.appendChild(div);
      });
    }

    async function openMessage(id) {
      const detail = await fetchMessage(id);
      if (!detail) return;
      $('modalSubject').textContent = detail.subject || '(no subject)';
      const fromAddr = detail.from?.address || detail.from?.name || 'unknown';
      const toAddr = detail.to?.[0]?.address || session?.address || 'unknown';
      $('modalBody').innerHTML = `
        <div class="meta">
          <span><strong>From:</strong> ${escapeHtml(fromAddr)}</span>
          <span><strong>To:</strong> ${escapeHtml(toAddr)}</span>
          <span><strong>Date:</strong> ${formatDate(detail.createdAt)}</span>
        </div>
        <div style="border-top:1px solid var(--border); padding-top:14px;">
          ${detail.html ? `<iframe sandbox="allow-same-origin" srcdoc="${escapeAttr(detail.html)}"></iframe>` : `<pre style="white-space:pre-wrap; font-family:inherit;">${escapeHtml(detail.text || detail.intro || '(no content)')}</pre>`}
        </div>
      `;
      $('overlay').classList.add('open');
    }

    function closeModal() {
      $('overlay').classList.remove('open');
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }
    function escapeAttr(t) {
      return t.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    }

    function startPolling() {
      stopPolling();
      fetchMessages();
      pollTimer = setInterval(fetchMessages, POLL_INTERVAL);
    }
    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    function copyEmail() {
      if (!session) { setStatus('No inbox active.', 'err'); return; }
      navigator.clipboard.writeText(session.address).then(() => {
        setStatus('Email copied to clipboard.', 'ok');
      }).catch(() => {
        setStatus('Copy failed.', 'err');
      });
    }

    function resetAll() {
      if (!confirm('Delete this inbox from this device? You won\'t be able to recover it.')) return;
      stopPolling();
      session = null;
      saveSession();
      messagesCache = [];
      $('emailInput').value = '';
      renderMessages([]);
      setStatus('Inbox reset. Create a new one to start.', '');
    }

    // Init
    $('randomBtn').onclick = generateRandom;
    $('createBtn').onclick = createInbox;
    $('copyBtn').onclick = copyEmail;
    $('resetBtn').onclick = resetAll;
    $('modalClose').onclick = closeModal;
    $('overlay').onclick = (e) => { if (e.target === $('overlay')) closeModal(); };

    // Enter key on input triggers create
    $('emailInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') createInbox();
    });

    (async () => {
      await fetchDomains();
      loadSession();
      if (session && session.address) {
        $('emailInput').value = session.address.split('@')[0];
        setStatus(`Restored inbox: ${session.address}`, 'ok');
        startPolling();
      } else {
        generateRandom();
      }
    })();
  </script>
</body>
</html>
